name: company-aliases
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:8091:8000"
    environment:
      ALIAS_DATABASE_PATH: /data/aliases.sqlite3
      ALIAS_API_TOKEN_FILE: /run/secrets/alias_api_token
    volumes:
      - ../data:/data
    secrets:
      - alias_api_token
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 5m
      start_period: 10s
      start_interval: 2s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
secrets:
  alias_api_token:
    file: ../secrets/api-token
